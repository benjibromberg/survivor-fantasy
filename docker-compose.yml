services:
  cloudflared:
    # Pinned by tag+digest, the way the Dockerfile pins its base image. `:latest`
    # does not mean "current", it means whatever was pulled the last time this
    # container happened to be recreated. This digest is the one already
    # running, so the pin changes nothing about what is deployed.
    # Re-pin with: docker buildx imagetools inspect cloudflare/cloudflared:<tag>
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: tunnel --no-autoupdate run
    environment:
      # Remotely-managed tunnel token from the Cloudflare Zero Trust dashboard.
      # The tunnel's public hostname route (e.g. www.benjis-survivor-fantasy.party
      # -> http://survivor-fantasy:5050) and the Access policy are configured in
      # the dashboard, not here.
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped

  survivor-fantasy:
    build: .
    env_file:
      - .env
    volumes:
      - ${APPDATA_DIR:-.}/data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/survivor_fantasy.db
    # Reachable to the cloudflared sidecar over the compose network as
    # http://survivor-fantasy:5050 (gunicorn binds 0.0.0.0:5050).
    expose:
      - "5050"
    # `restart: unless-stopped` only sees a process that exited. A gunicorn that
    # is wedged, deadlocked or answering 500 keeps the container "running", so
    # anything watching container state alone reports it healthy. This is what
    # closes that gap, and Docker reports the result as the container's health.
    #
    # Hits `/`, which calls Season.get_active() and so exercises Flask,
    # SQLAlchemy and SQLite rather than a static file. `/` then redirects to the
    # active leaderboard, and http.client is used instead of urllib precisely
    # because it does NOT follow that redirect: urlopen() would render a full
    # standings page every interval. Anything < 400 is healthy, so the 302 is a
    # pass and a 500 is not.
    #
    # python is the only option in the image: it is python:3.11-slim with no
    # curl and no wget. It runs as appuser and needs no privileges.
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',5050,timeout=4); c.request('GET','/'); sys.exit(0 if c.getresponse().status < 400 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      # create_app() runs create_all() plus a column and index sync behind a
      # cross-process file lock before the first worker serves, so the first
      # probe must not arrive during that.
      start_period: 40s
    restart: unless-stopped
