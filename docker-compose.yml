services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Remotely-managed tunnel token from the Cloudflare Zero Trust dashboard.
      # The tunnel's public hostname route (e.g. www.benjis-survivor-fantasy.party
      # -> http://survivor-fantasy:5050) and the Access policy are configured in
      # the dashboard, not here.
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped

  survivor-fantasy:
    build: .
    env_file:
      - .env
    volumes:
      - ${APPDATA_DIR:-.}/data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/survivor_fantasy.db
    # Reachable to the cloudflared sidecar over the compose network as
    # http://survivor-fantasy:5050 (gunicorn binds 0.0.0.0:5050).
    expose:
      - "5050"
    restart: unless-stopped
