services:
  cloudflared:
    # Pinned by tag+digest, the way the Dockerfile pins its base image. `:latest`
    # does not mean "current", it means whatever was pulled the last time this
    # container happened to be recreated. This digest is the one already
    # running, so the pin changes nothing about what is deployed.
    # Re-pin with: docker buildx imagetools inspect cloudflare/cloudflared:<tag>
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: tunnel --no-autoupdate run
    environment:
      # Remotely-managed tunnel token from the Cloudflare Zero Trust dashboard.
      # The tunnel's public hostname route (e.g. www.benjis-survivor-fantasy.party
      # -> http://survivor-fantasy:5050) and the Access policy are configured in
      # the dashboard, not here.
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped

  survivor-fantasy:
    build: .
    env_file:
      - .env
    volumes:
      - ${APPDATA_DIR:-.}/data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/survivor_fantasy.db
    # Reachable to the cloudflared sidecar over the compose network as
    # http://survivor-fantasy:5050 (gunicorn binds 0.0.0.0:5050).
    expose:
      - "5050"
    restart: unless-stopped
