[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # use ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402"]    # load_dotenv() must run before app imports
"seed.py" = ["E402"]   # load_dotenv() must run before app imports

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on a leaked SQLite connection or file. Python reports one only when
# the garbage collector finalizes it (for connections, from 3.13 on), and
# pytest turns a warning raised there into PytestUnraisableExceptionWarning,
# so both must be errors. Close what a fixture opens: the session with
# db.session.remove(), then the pool with db.engine.dispose().
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
